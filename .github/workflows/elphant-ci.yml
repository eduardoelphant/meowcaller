name: elphant-ci

on:
  push:
    branches: [elphant]
  pull_request:
    branches: [elphant]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libopus
        run: sudo apt-get update && sudo apt-get install -y libopus-dev pkg-config
      - run: go vet ./...
      - run: go test ./...
